# Khai báo cổng và tên Service
server.port=8814
spring.application.name=payment-service

# Kết nối CSDL MySQL (Nhớ tạo một database trống tên là payment_db trong phpMyAdmin nhé)
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate tự động tạo bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Khai báo lên Eureka (Sổ địa chỉ)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/