# ==========================================
# CẤU HÌNH SERVER & EUREKA
# ==========================================
server.port=8810
spring.application.name=product-catalog-service

# Eureka Server registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# CẤU HÌNH DATABASE (MYSQL - XAMPP)
# ==========================================
# Tự động tạo database 'product_catalog' nếu chưa tồn tại
spring.datasource.url=jdbc:mysql://localhost:3306/product-catalog?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE (Spring Boot 3 / Hibernate 6)
# ==========================================
spring.jpa.show-sql=true
# Hibernate 6 tự nhận diện Dialect rất tốt, nhưng khai báo rõ cho MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Tắt tính năng query metadata của Hibernate để khởi động nhanh hơn (tùy chọn)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==========================================
# TĂNG GIỚI HẠN DUNG LƯỢNG CHO ẢNH BASE64
# ==========================================
server.tomcat.max-http-form-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB